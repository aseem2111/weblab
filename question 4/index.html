<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grade Checker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat"
    style="background-image: url('background.jpg');"
>

    <!-- Dark overlay -->
    <div class="absolute inset-0 bg-black/40"></div>

    <!-- Main Card -->
    <div class="relative w-full max-w-md px-6">

        <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 text-center">

            <!-- Icon -->
            <div class="text-5xl mb-4">
                🎓
            </div>

            <!-- Heading -->
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                Student Grade Checker
            </h1>

            <p class="text-gray-500 mb-8">
                Enter your marks to find your grade
            </p>

            <!-- Input -->
            <div class="text-left mb-5">

                <label
                    for="marks"
                    class="block text-sm font-semibold text-gray-700 mb-2"
                >
                    Your Marks
                </label>

                <input
                    type="number"
                    id="marks"
                    placeholder="Enter marks (0 - 100)"
                    min="0"
                    max="100"
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl
                           outline-none transition
                           focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"
                >

            </div>

            <!-- Button -->
            <button
                onclick="checkGrade()"
                class="w-full py-3 rounded-xl
                       bg-gradient-to-r from-indigo-500 to-purple-600
                       text-white font-bold text-lg
                       shadow-lg
                       hover:scale-[1.02] hover:shadow-xl
                       active:scale-95
                       transition duration-200"
            >
                Check Grade
            </button>

            <!-- Result -->
            <div class="mt-6 min-h-[40px]">

                <h3
                    id="output"
                    class="text-xl font-bold text-gray-800"
                ></h3>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
